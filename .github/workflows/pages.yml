# Chỉ build Pages khi TRANG đổi (index.html, ảnh). Dữ liệu (xu.json, trang_thai.json, lenh.json) tool push liên tục,
# web đọc thẳng từ raw.githubusercontent.com -> không cần build, khỏi xếp hàng chờ.
name: Pages
on:
  push:
    branches: [main]
    paths: ["index.html", "*.webp", "*.png", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
