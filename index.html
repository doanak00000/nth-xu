<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xu nhân vật NTH</title>
<style>
  :root { --bg:#f3f1ec; --card:#fff; --head:#faf8f4; --fg:#1d1b18; --muted:#7a7366; --line:#e8e3d9;
          --accent:#a8701a; --today:#fff6e6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14120e; --card:#1e1b16; --head:#25211b; --fg:#eee8dc; --muted:#9d9585; --line:#332e26;
            --accent:#e8b04f; --today:#2a2316; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width:820px; margin:0 auto; padding:20px 12px 40px; }
  h1 { font-size:20px; margin:0 0 2px; display:flex; align-items:center; gap:8px; }
  h1::before { content:""; width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #f6d27a, var(--accent)); }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  details { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden; }
  summary { cursor:pointer; padding:12px 14px; font-weight:600; display:flex; align-items:center; gap:10px; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"▸"; color:var(--muted); transition:transform .15s; }
  details[open] summary::before { transform:rotate(90deg); }
  summary span { margin-left:auto; color:var(--muted); font-weight:400; font-size:13px; }
  .wrap { overflow-x:auto; border-top:1px solid var(--line); }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  th, td { text-align:right; padding:9px 12px; white-space:nowrap; }
  tr + tr td { border-top:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  th { background:var(--head); color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
  th .cr { text-transform:none; letter-spacing:0; font-weight:400; }
  th:last-child, td:last-child { background:var(--today); }
  .xu { color:var(--accent); font-weight:700; }
  .cr { color:var(--muted); font-size:11.5px; display:block; }
  .empty { color:var(--muted); }
  summary .st { margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:1px; }
  summary .st + span { margin-left:12px; }
  .badge { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--head); color:var(--muted); }
  .badge.chay { background:#e3effc; color:#1d5fa8; }
  .badge.xong { background:#e2f4e6; color:#22783a; }
  .badge.loi { background:#fbe5e3; color:#b03a2e; }
  @media (prefers-color-scheme: dark) {
    .badge.chay { background:#17283c; color:#7fb6f0; }
    .badge.xong { background:#16301d; color:#7fd394; }
    .badge.loi { background:#3a1b18; color:#f0948a; }
  }
  .bd { font-size:11.5px; color:var(--muted); font-weight:400; }
</style>
</head>
<body>
<main>
  <h1>Xu nhân vật NTH</h1>
  <div class="sub" id="sub">Đang tải…</div>
  <div id="list"></div>
</main>
<script>
const lay = f => fetch(f + "?t=" + Date.now()).then(r => r.ok ? r.json() : {});
Promise.all([lay("xu.json"), lay("trang_thai.json").catch(() => ({}))]).then(([data, tt]) => {
  const list = document.getElementById("list");
  const accs = [...new Set([...Object.keys(data), ...Object.keys(tt)])].sort();
  // giống cột Trạng thái trên UI bot
  const nhanSt = t => ({ chay: `▶ đang chạy ${Math.min(t.nv + 1, 6)}/6`, do: `⏸ dở ${t.nv}/6`,
                         xong: t.nv > 0 && t.nv < 6 ? `⚠ xong ${t.nv}/6` : "✓ xong", loi: "✗ lỗi" })[t.st] || "chưa chạy";
  const nhanBd = s => { const [d, h] = s.split(" ");
    return "bắt đầu " + h + (d === ngay(0) ? "" : " " + d.split("-").reverse().slice(0, 2).join("/")); };
  let last = "";
  // 3 cột cố định theo ngày của người xem: 2 hôm trước / hôm qua / hôm nay
  const ngay = k => { const d = new Date(); d.setDate(d.getDate() - k);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const days = [ngay(2), ngay(1), ngay(0)], nhan = ["2 hôm trước", "Hôm qua", "Hôm nay"];
  for (const acc of accs) {
    const nvs = data[acc] || {};
    const det = document.createElement("details");
    const sum = document.createElement("summary");
    sum.textContent = acc;
    const st = document.createElement("div");
    st.className = "st";
    const t = tt[acc] || { st: "", nv: 0, bat_dau: "" };
    const b = document.createElement("span");
    b.className = "badge " + (t.st === "xong" && t.nv > 0 && t.nv < 6 ? "loi" : t.st); b.textContent = nhanSt(t); st.appendChild(b);
    if (t.bat_dau) { const bd = document.createElement("span"); bd.className = "bd"; bd.textContent = nhanBd(t.bat_dau); st.appendChild(bd); }
    sum.appendChild(st);
    const sp = document.createElement("span");
    sp.textContent = Object.keys(nvs).length + " nhân vật";
    sum.appendChild(sp);
    det.appendChild(sum);
    const wrap = document.createElement("div");
    wrap.className = "wrap";
    const tbl = document.createElement("table");
    const hr = tbl.insertRow();
    const th0 = document.createElement("th"); th0.textContent = "Nhân vật"; hr.appendChild(th0);
    days.forEach((d, i) => {
      const th = document.createElement("th"); th.textContent = nhan[i];
      const s = document.createElement("span"); s.className = "cr"; s.textContent = d.split("-").reverse().slice(0, 2).join("/");
      th.appendChild(s); hr.appendChild(th);
    });
    for (const k of Object.keys(nvs).sort((a, b) => a.localeCompare(b, "vi"))) {
      const nv = nvs[k], tr = tbl.insertRow();
      tr.insertCell().textContent = k;
      for (const d of days) {
        const td = tr.insertCell(), v = nv.ngay[d];
        if (!v) { td.textContent = "—"; td.className = "empty"; continue; }
        const x = document.createElement("span"); x.className = "xu"; x.textContent = v.xu || "?";
        td.appendChild(x);
        if (v.chua_rut) { const c = document.createElement("span"); c.className = "cr"; c.textContent = "chưa rút " + v.chua_rut; td.appendChild(c); }
        if (d + " " + (v.luc || "") > last) last = d + " " + (v.luc || "");
      }
    }
    wrap.appendChild(tbl);
    det.appendChild(wrap);
    list.appendChild(det);
  }
  document.getElementById("sub").textContent = accs.length
    ? "Bấm vào tài khoản để xem nhân vật · 3 ngày gần nhất · cập nhật lần cuối " + last
    : "Chưa có dữ liệu.";
}).catch(() => { document.getElementById("sub").textContent = "Không tải được dữ liệu."; });
</script>
</body>
</html>
