<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xu nhân vật NTH</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --fg:#1d1b18; --muted:#6d675e; --line:#e4dfd5; --accent:#b07a1e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16140f; --card:#211e18; --fg:#eee8dc; --muted:#a39b8c; --line:#363128; --accent:#e0a94a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  details { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:10px; }
  summary { cursor:pointer; padding:12px 16px; font-weight:600; display:flex; justify-content:space-between; gap:12px; }
  summary span { color:var(--muted); font-weight:400; font-size:13px; }
  .wrap { overflow-x:auto; padding:0 16px 14px; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  th, td { text-align:right; padding:6px 8px; border-top:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--muted); font-weight:500; font-size:13px; }
  .xu { color:var(--accent); font-weight:600; }
  .cr { color:var(--muted); font-size:12px; display:block; }
  .empty { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Xu nhân vật NTH</h1>
  <div class="sub" id="sub">Đang tải…</div>
  <div id="list"></div>
</main>
<script>
fetch("xu.json?t=" + Date.now()).then(r => r.json()).then(data => {
  const list = document.getElementById("list");
  const accs = Object.keys(data).sort();
  let last = "";
  for (const acc of accs) {
    const nvs = data[acc];
    const days = [...new Set(Object.values(nvs).flatMap(n => Object.keys(n.ngay)))].sort().reverse().slice(0, 3);
    const det = document.createElement("details");
    const sum = document.createElement("summary");
    sum.textContent = acc;
    const sp = document.createElement("span");
    sp.textContent = Object.keys(nvs).length + " nhân vật";
    sum.appendChild(sp);
    det.appendChild(sum);
    const wrap = document.createElement("div");
    wrap.className = "wrap";
    const tbl = document.createElement("table");
    const hr = tbl.insertRow();
    for (const h of ["Nhân vật", ...days.map(d => d.split("-").reverse().slice(0, 2).join("/"))]) {
      const th = document.createElement("th"); th.textContent = h; hr.appendChild(th);
    }
    for (const k of Object.keys(nvs).sort((a, b) => parseInt(a.slice(2)) - parseInt(b.slice(2)))) {
      const nv = nvs[k], tr = tbl.insertRow();
      tr.insertCell().textContent = k.toUpperCase() + (nv.ten ? " · " + nv.ten : "");
      for (const d of days) {
        const td = tr.insertCell(), v = nv.ngay[d];
        if (!v) { td.textContent = "—"; td.className = "empty"; continue; }
        const x = document.createElement("span"); x.className = "xu"; x.textContent = v.xu || "?";
        td.appendChild(x);
        if (v.chua_rut) { const c = document.createElement("span"); c.className = "cr"; c.textContent = "chưa rút " + v.chua_rut; td.appendChild(c); }
        if (d + " " + (v.luc || "") > last) last = d + " " + (v.luc || "");
      }
    }
    wrap.appendChild(tbl);
    det.appendChild(wrap);
    list.appendChild(det);
  }
  document.getElementById("sub").textContent = accs.length
    ? "Bấm vào tài khoản để xem nhân vật · 3 ngày gần nhất · cập nhật lần cuối " + last
    : "Chưa có dữ liệu.";
}).catch(() => { document.getElementById("sub").textContent = "Không tải được dữ liệu."; });
</script>
</body>
</html>
